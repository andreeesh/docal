name: Desktop CI

on:
  push:
    branches: [main, develop, "feat/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  rust-linux:
    name: Rust · Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked

  rust-windows:
    name: Rust · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked
