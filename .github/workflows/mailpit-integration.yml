name: Mailpit Docker Integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mailpit-integration.yml'
      - 'proxy/docker-compose.yml'
      - 'scripts/start-proxy.sh'
      - 'scripts/docal'
      - 'scripts/mailpit-site.py'
      - 'templates/Dockerfile.tpl'
      - 'tests/test_mailpit_contract.sh'
      - 'tests/test_mailpit_existing_site.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mailpit-integration.yml'
      - 'proxy/docker-compose.yml'
      - 'scripts/start-proxy.sh'
      - 'scripts/docal'
      - 'scripts/mailpit-site.py'
      - 'templates/Dockerfile.tpl'
      - 'tests/test_mailpit_contract.sh'
      - 'tests/test_mailpit_existing_site.sh'

permissions:
  contents: read

jobs:
  mailpit-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated Mailpit on Docker-only SMTP network
        shell: bash
        run: |
          set -euo pipefail
          docker network create docal-proxy
          docker compose -f proxy/docker-compose.yml up -d mailpit
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8025/api/v1/messages >/dev/null

          # The SMTP listener must NOT be published on the host.
          [[ "$(docker port docal-mailpit 8025/tcp)" == '127.0.0.1:8025' ]]
          if docker port docal-mailpit 1025/tcp >/dev/null 2>&1; then
            echo 'SMTP port 1025 was published to the host' >&2
            exit 1
          fi

          # Mailpit must not be discoverable through Traefik.
          [[ "$(docker inspect --format '{{ index .Config.Labels "traefik.enable" }}' docal-mailpit)" == false ]]

      - name: Build real generated WordPress PHP image with msmtp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/docal-mailpit-probe
          sed 's/__PHP_IMAGE_TAG__/php8.3-apache/g' templates/Dockerfile.tpl \
            > /tmp/docal-mailpit-probe/Dockerfile
          docker build --progress=plain -t docal/mailpit-ci:local \
            /tmp/docal-mailpit-probe

      - name: Validate opt-in WordPress Mailpit MU-plugin syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('site_mail', 'scripts/mailpit-site.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path('/tmp/docal-mailpit-probe/docal-mailpit-capture.php').write_text(module.PLUGIN_SOURCE)
          PY
          docker run --rm --entrypoint php \
            -v /tmp/docal-mailpit-probe:/ci:ro \
            docal/mailpit-ci:local -l /ci/docal-mailpit-capture.php
      - name: Verify PHP mail sends to Mailpit, not to real recipients
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user 33:33 --network docal-proxy \
            --entrypoint php docal/mailpit-ci:local -r \
            'if (!mail("qa@example.test", "Docal Mailpit PHP smoke", "Local synthetic capture only")) { exit(42); }'

          # Verify capture via Mailpit's REST API. No external SMTP server
          # or real recipient is involved.
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages \
              | grep -Fq 'Docal Mailpit PHP smoke'; then
              echo 'Mailpit captured the synthetic PHP mail() message'
              exit 0
            fi
            sleep 1
          done
          echo 'PHP mail() did not appear in the Mailpit inbox' >&2
          exit 1

      - name: Verify Mailpit scoped stop
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f proxy/docker-compose.yml stop mailpit
          [[ "$(docker inspect --format '{{.State.Running}}' docal-mailpit)" == false ]]

      - name: Clean synthetic CI Docker resources
        if: always()
        shell: bash
        run: |
          docker compose -f proxy/docker-compose.yml down || true
          docker network rm docal-proxy || true
