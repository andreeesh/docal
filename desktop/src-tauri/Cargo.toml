[package]
name = "docal-desktop"
version = "0.1.0"
description = "Docal Desktop native foundation"
authors = ["Docal"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "docal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
